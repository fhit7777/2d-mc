<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D 網頁版 Minecraft</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; 
      background-color: #87CEEB; 
      font-family: sans-serif;
      touch-action: none; /* 防止手機瀏覽器預設的滑動與縮放行為 */
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
      pointer-events: none;
      z-index: 10;
      font-size: 14px;
    }
    #hotbar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 10px;
      z-index: 10;
    }
    .slot {
      width: 35px;
      height: 35px;
      border: 3px solid #7f8c8d;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      box-sizing: border-box;
      cursor: pointer;
    }
    .slot.active { border-color: #f1c40f; transform: scale(1.1); }
    
    /* 手機虛擬按鍵樣式 */
    .mobile-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 20;
    }
    .mobile-btn:active { background: rgba(255, 255, 255, 0.6); }
    
    #btn-left { bottom: 30px; left: 20px; width: 60px; height: 60px; }
    #btn-right { bottom: 30px; left: 100px; width: 60px; height: 60px; }
    #btn-jump { bottom: 30px; right: 20px; width: 70px; height: 70px; }
    
    #btn-action {
      position: absolute;
      bottom: 120px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 15px;
      font-size: 16px;
      background: rgba(231, 76, 60, 0.6); 
      flex-direction: column;
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <div id="ui">
    <h3>⛏️ 2D Minecraft (手機完美版)</h3>
    <p>全亮視野無迷霧</p>
  </div>

  <div id="hotbar">
    <div class="slot active" id="slot-1" style="background: #8B4513;" onclick="selectBlock(1, 1)">1</div>
    <div class="slot" id="slot-2" style="background: #7f8c8d;" onclick="selectBlock(2, 3)">2</div>
    <div class="slot" id="slot-3" style="background: #5c4033;" onclick="selectBlock(3, 4)">3</div>
    <div class="slot" id="slot-4" style="background: #3498db;" onclick="selectBlock(4, 9)">4</div>
    <div class="slot" id="slot-5" style="background: #e74c3c;" onclick="selectBlock(5, 11)">T</div>
  </div>

  <!-- 手機虛擬按鍵 -->
  <div id="btn-left" class="mobile-btn">◀</div>
  <div id="btn-right" class="mobile-btn">▶</div>
  <div id="btn-jump" class="mobile-btn">▲</div>
  <div id="btn-action" class="mobile-btn">⛏️<br>挖礦</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const TILE_SIZE = 40; 
    const WORLD_COLS = 500; 
    const WORLD_ROWS = 150; 

    const AIR = 0; const DIRT = 1; const GRASS = 2; const STONE = 3; 
    const WOOD = 4; const LEAVES = 5; const COAL = 6; const GOLD = 7; 
    const DIAMOND = 8; const WATER = 9; const TORCH = 10; const TNT = 11; 

    let world = [];
    let currentBlock = DIRT; 
    let activeTNTs = []; 
    let actionMode = 'mine'; 

    // 生成地形與礦物 
    let terrainHeight = Math.floor(WORLD_ROWS / 4); 
    for (let x = 0; x < WORLD_COLS; x++) {
      world[x] = [];
      if (Math.random() < 0.3) terrainHeight += (Math.random() < 0.5 ? 1 : -1);
      if (terrainHeight < 10) terrainHeight = 10;
      if (terrainHeight > WORLD_ROWS - 20) terrainHeight = WORLD_ROWS - 20;
      for (let y = 0; y < WORLD_ROWS; y++) {
        if (y < terrainHeight) world[x][y] = AIR;
        else if (y === terrainHeight) world[x][y] = GRASS; 
        else if (y > terrainHeight + 5) world[x][y] = STONE; 
        else world[x][y] = DIRT; 
      }
    }

    for (let i = 0; i < 150; i++) {
      let currentX = Math.floor(Math.random() * WORLD_COLS);
      let currentY = Math.floor(Math.random() * (WORLD_ROWS - 30)) + 30; 
      let caveLength = Math.floor(Math.random() * 60) + 20; 
      for (let j = 0; j < caveLength; j++) {
        for (let cx = -1; cx <= 1; cx++) {
          for (let cy = -1; cy <= 1; cy++) {
            let carveX = currentX + cx; let carveY = currentY + cy;
            if (carveX >= 0 && carveX < WORLD_COLS && carveY >= 0 && carveY < WORLD_ROWS) {
              if (world[carveX][carveY] === STONE || world[carveX][carveY] === DIRT) world[carveX][carveY] = AIR;
            }
          }
        }
        currentX += Math.floor(Math.random() * 3) - 1; 
        currentY += Math.floor(Math.random() * 3) - 1; 
      }
    }

    const player = {
      x: (WORLD_COLS * TILE_SIZE) / 2, y: 0, width: 24, height: 36,
      vx: 0, vy: 0, speed: 5, jumpPower: -10, gravity: 0.5, grounded: false, facing: 'right' 
    };

    const camera = { x: 0, y: 0 };
    const keys = { a: false, d: false, w: false };
    let frameCount = 0;

    window.selectBlock = function(slotId, blockId) {
      document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
      document.getElementById('slot-' + slotId).classList.add('active');
      currentBlock = blockId;
    }

    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.a = true; }, {passive: false});
    document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); keys.a = false; }, {passive: false});
    
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.d = true; }, {passive: false});
    document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); keys.d = false; }, {passive: false});
    
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); keys.w = true; }, {passive: false});
    document.getElementById('btn-jump').addEventListener('touchend', (e) => { e.preventDefault(); keys.w = false; }, {passive: false});

    const btnAction = document.getElementById('btn-action');
    btnAction.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (actionMode === 'mine') {
        actionMode = 'place';
        btnAction.innerHTML = '🧱<br>放置';
        btnAction.style.background = 'rgba(46, 204, 113, 0.6)'; 
      } else {
        actionMode = 'mine';
        btnAction.innerHTML = '⛏️<br>挖礦';
        btnAction.style.background = 'rgba(231, 76, 60, 0.6)'; 
      }
    }, {passive: false});

    // === 重點修復區域：解決手機無法放置方塊的 Bug ===
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault(); // 核心：阻擋手機瀏覽器自動產生滑鼠點擊事件 (避免剛放下去又被挖掉)
      
      if(e.touches[0].target !== canvas) return;
      
      const worldX = e.touches[0].clientX + camera.x;
      const worldY = e.touches[0].clientY + camera.y;
      const gridX = Math.floor(worldX / TILE_SIZE);
      const gridY = Math.floor(worldY / TILE_SIZE);

      if (gridX >= 0 && gridX < WORLD_COLS && gridY >= 0 && gridY < WORLD_ROWS) {
        if (actionMode === 'mine') {
          world[gridX][gridY] = AIR; 
        } else if (actionMode === 'place') {
          if (world[gridX][gridY] === TNT) {
            // 點燃 TNT
            world[gridX][gridY] = AIR;
            activeTNTs.push({ x: gridX, y: gridY, timer: 90 });
          } else if (world[gridX][gridY] === AIR || world[gridX][gridY] === WATER) {
            world[gridX][gridY] = currentBlock; // 成功放置方塊！
          }
        }
      }
    }, {passive: false});

    // 電腦版滑鼠事件
    canvas.addEventListener('mousedown', (e) => {
      const worldX = e.clientX + camera.x;
      const worldY = e.clientY + camera.y;
      const gridX = Math.floor(worldX / TILE_SIZE);
      const gridY = Math.floor(worldY / TILE_SIZE);

      if (gridX >= 0 && gridX < WORLD_COLS && gridY >= 0 && gridY < WORLD_ROWS) {
        if (e.button === 0) world[gridX][gridY] = AIR; 
        else if (e.button === 2) {
          if (world[gridX][gridY] === TNT) {
            world[gridX][gridY] = AIR; activeTNTs.push({ x: gridX, y: gridY, timer: 90 });
          } else if (world[gridX][gridY] === AIR || world[gridX][gridY] === WATER) {
            world[gridX][gridY] = currentBlock;
          }
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'w' || e.key === 'W' || e.key === ' ') keys.w = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'w' || e.key === 'W' || e.key === ' ') keys.w = false;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    function isSolid(x, y) {
      const gridX = Math.floor(x / TILE_SIZE);
      const gridY = Math.floor(y / TILE_SIZE);
      if (gridX < 0 || gridX >= WORLD_COLS || gridY < 0 || gridY >= WORLD_ROWS) return true;
      return world[gridX][gridY] !== AIR && world[gridX][gridY] !== WATER;
    }

    function update() {
      frameCount++;
      
      for (let i = activeTNTs.length - 1; i >= 0; i--) {
        let tnt = activeTNTs[i];
        tnt.timer--;
        if (tnt.timer <= 0) {
          let explosionRadius = 4;
          for (let cx = -explosionRadius; cx <= explosionRadius; cx++) {
            for (let cy = -explosionRadius; cy <= explosionRadius; cy++) {
              if (cx * cx + cy * cy <= explosionRadius * explosionRadius) {
                let ex = tnt.x + cx; let ey = tnt.y + cy;
                if (ex >= 0 && ex < WORLD_COLS && ey >= 0 && ey < WORLD_ROWS) world[ex][ey] = AIR;
              }
            }
          }
          activeTNTs.splice(i, 1);
          camera.x += (Math.random() - 0.5) * 40;
          camera.y += (Math.random() - 0.5) * 40;
        }
      }

      if (keys.a) { player.vx = -player.speed; player.facing = 'left'; } 
      else if (keys.d) { player.vx = player.speed; player.facing = 'right'; } 
      else { player.vx = 0; }

      player.gravity = 0.5; 
      if (keys.w && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      player.vy += player.gravity;
      player.x += player.vx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > WORLD_COLS * TILE_SIZE) player.x = WORLD_COLS * TILE_SIZE - player.width;

      if (player.vx > 0) {
        if (isSolid(player.x + player.width, player.y) || isSolid(player.x + player.width, player.y + player.height - 1)) {
          player.x = Math.floor((player.x + player.width) / TILE_SIZE) * TILE_SIZE - player.width - 0.1;
        }
      } else if (player.vx < 0) {
        if (isSolid(player.x, player.y) || isSolid(player.x, player.y + player.height - 1)) {
          player.x = Math.floor(player.x / TILE_SIZE) * TILE_SIZE + TILE_SIZE + 0.1;
        }
      }

      player.y += player.vy;
      player.grounded = false;
      
      if (player.vy > 0) {
        if (isSolid(player.x, player.y + player.height) || isSolid(player.x + player.width - 1, player.y + player.height)) {
          player.y = Math.floor((player.y + player.height) / TILE_SIZE) * TILE_SIZE - player.height;
          player.vy = 0;
          player.grounded = true;
        }
      } else if (player.vy < 0) {
        if (isSolid(player.x, player.y) || isSolid(player.x + player.width - 1, player.y)) {
          player.y = Math.floor(player.y / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
          player.vy = 0;
        }
      }

      camera.x = player.x + player.width / 2 - canvas.width / 2;
      camera.y = player.y + player.height / 2 - canvas.height / 2;
      if (camera.x < 0) camera.x = 0;
      if (camera.x > WORLD_COLS * TILE_SIZE - canvas.width) camera.x = WORLD_COLS * TILE_SIZE - canvas.width;
      if (camera.y < 0) camera.y = 0;
      if (camera.y > WORLD_ROWS * TILE_SIZE - canvas.height) camera.y = WORLD_ROWS * TILE_SIZE - canvas.height;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
      const endCol = Math.min(WORLD_COLS, startCol + Math.ceil(canvas.width / TILE_SIZE) + 1);
      const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
      const endRow = Math.min(WORLD_ROWS, startRow + Math.ceil(canvas.height / TILE_SIZE) + 1);

      for (let x = startCol; x < endCol; x++) {
        for (let y = startRow; y < endRow; y++) {
          let block = world[x][y];
          if (block === AIR) continue;

          const screenX = x * TILE_SIZE - camera.x;
          const screenY = y * TILE_SIZE - camera.y;

          if (block === GRASS) ctx.fillStyle = '#2ecc71'; 
          else if (block === DIRT) ctx.fillStyle = '#8B4513'; 
          else if (block === STONE) ctx.fillStyle = '#7f8c8d'; 
          else if (block === WOOD) ctx.fillStyle = '#5c4033';
          else if (block === WATER) ctx.fillStyle = 'rgba(52, 152, 219, 0.7)';
          
          if (block !== TNT) {
            ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          }

          if (block === TNT) {
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE); 
            ctx.fillStyle = '#ecf0f1'; ctx.fillRect(screenX, screenY + 12, TILE_SIZE, 16); 
            ctx.fillStyle = 'black'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('TNT', screenX + 6, screenY + 24); 
          }
        }
      }

      for (let tnt of activeTNTs) {
        const screenX = tnt.x * TILE_SIZE - camera.x;
        const screenY = tnt.y * TILE_SIZE - camera.y;
        if (Math.floor(frameCount / 5) % 2 === 0) ctx.fillStyle = '#ffffff'; 
        else ctx.fillStyle = '#e74c3c'; 
        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
      }

      ctx.save();
      ctx.translate(player.x - camera.x + player.width / 2, player.y - camera.y + player.height / 2);
      if (player.facing === 'left') ctx.scale(-1, 1);
      let px = -12; let py = -18; 
      let swing = (player.vx !== 0 && player.grounded) ? Math.sin(frameCount * 0.4) * 6 : (player.grounded ? 0 : 3); 

      ctx.fillStyle = '#0097a7'; ctx.fillRect(px+12 - swing, py+12, 6, 5); 
      ctx.fillStyle = '#d3a86c'; ctx.fillRect(px+12 - swing, py+17, 6, 7); 
      ctx.fillStyle = '#152b47'; ctx.fillRect(px+12 + swing, py+24, 6, 9); 
      ctx.fillStyle = '#444444'; ctx.fillRect(px+12 + swing, py+33, 6, 3); 
      ctx.fillStyle = '#00BFFF'; ctx.fillRect(px+6, py+12, 12, 12);
      ctx.fillStyle = '#F1C27D'; ctx.fillRect(px+14, py+12, 4, 3);
      ctx.fillStyle = '#F1C27D'; ctx.fillRect(px+5, py, 14, 12); 
      ctx.fillStyle = '#4A3623'; ctx.fillRect(px+5, py, 14, 3); ctx.fillRect(px+5, py+3, 4, 5); 
      ctx.fillStyle = 'white'; ctx.fillRect(px+14, py+4, 3, 2); 
      ctx.fillStyle = '#3498db'; ctx.fillRect(px+17, py+4, 2, 2); 
      ctx.fillStyle = '#4A3623'; ctx.fillRect(px+14, py+9, 5, 3); 
      ctx.fillStyle = '#1E3F66'; ctx.fillRect(px+6 - swing, py+24, 6, 9); 
      ctx.fillStyle = '#555555'; ctx.fillRect(px+6 - swing, py+33, 6, 3); 
      ctx.fillStyle = '#00BFFF'; ctx.fillRect(px+6 + swing, py+12, 6, 5); 
      ctx.fillStyle = '#F1C27D'; ctx.fillRect(px+6 + swing, py+17, 6, 7); 
      ctx.restore();
    }

    function loop() {
      update(); draw(); requestAnimationFrame(loop);
    }
    loop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
